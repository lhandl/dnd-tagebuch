# config.toml (nicht hugo.toml) — laeuft auch mit aelteren Hugo-Versionen.
# baseURL wird beim Bau in der Action ueberschrieben; hier steht der Endzustand.
baseURL = "https://lhandl.github.io/dnd-tagebuch/"
languageCode = "de-at"
title = "Die Chronik des Himmelszorns"

buildDrafts = false
enableEmoji = true
removePathAccents = true

[params]
  untertitel = "Aufzeichnungen des Thalion Himmelszorn"
  # Kurzer Geleittext auf der Startseite. Steht in Thalions Stimme; frei änderbar,
  # ohne dass ein Layout angefasst werden muss.
  geleit = "Ich bin Thalion Himmelszorn, Hochelf und Paladin des Ordens des Panzerhandschuhs. Ich habe den Eid der Rache geschworen. Was hier steht, ist kein Heldenlied — es sind die Nächte unter Baldurs Tor, der Gestank der Katakomben und die Namen derer, die ich nicht retten konnte."
  # Für Suchmaschinen und geteilte Verweise.
  beschreibung = "Das Tagebuch des Hochelfen Thalion Himmelszorn, Paladin des Ordens des Panzerhandschuhs und Träger des Eids der Rache, aufgezeichnet in Baldurs Tor im Jahr 1492."
  # Zeile im Fuß.
  wahlspruch = "Orden des Panzerhandschuhs · Eid der Rache"
  # Beitraege mit draft: true erscheinen erst nach 'draft: false'.

[permalinks]
  posts = "/eintrag/:slug/"

[taxonomies]
  tag = "tags"
  ort = "orte"

[markup.goldmark.renderer]
  unsafe = true

# Die Jahresrolle (Roll of Years). In den Realms traegt jedes Jahr einen Namen,
# den Auguren im Voraus verkuenden und der sich erst im Rueckblick erfuellt.
#
# Kanonische englische Namen — Operator-Entscheid 2026-08-26: englische
# Bezeichnungen bleiben, keine Uebersetzung. 1492 ist belegt durch Christopher
# Perkins (WotC) und wird von Baldur's Gate 3 ingame verwendet; die uebrigen
# stammen aus der Roll-of-Years-Liste (Forgotten Realms Wiki, Wikidot),
# keine gedruckte Primaerquelle geprueft.
[params.jahresnamen]
  "1489" = "Year of the Warrior Princess"
  "1490" = "Year of the Star Walker's Return"
  "1491" = "Year of the Scarlet Witch"
  "1492" = "Year of Three Ships Sailing"
  "1493" = "Year of the Purple Dragons"
  "1494" = "Year of Twelve Warnings"
  "1495" = "Year of the Tyrant's Pawn"
  "1496" = "Year of the Duplicitous Courtier"
