# Baut die Seite bei jedem Push auf main und veroeffentlicht sie auf GitHub Pages.
#
# Die Hugo-Version ist hier FESTGENAGELT und bewusst neuer als die lokal
# installierte (0.92 von 2023). Lokal dient Hugo nur der Vorschau; was
# veroeffentlicht wird, baut diese Action - sonst haengt das Ergebnis daran,
# wer zuletzt gebaut hat.
name: Seite bauen und veroeffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:          # erlaubt das Ausloesen von Hand

permissions:
  contents: read
  pages: write
  id-token: write

# Laeuft ein Bau noch, wird der naechste eingereiht statt parallel gestartet.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.134.3
    steps:
      - name: Hugo einrichten
        run: |
          wget -q -O /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0        # fuer .GitInfo und .Lastmod

      - uses: actions/configure-pages@v5
        id: pages

      - name: Bauen
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
          # Kein --buildDrafts: Entwuerfe bleiben unveroeffentlicht.

      - name: Ergebnis pruefen
        run: |
          test -f public/index.html || { echo "::error::public/index.html fehlt - Bau ohne Ergebnis"; exit 1; }
          anzahl=$(find public -name '*.html' | wc -l)
          echo "Erzeugte Seiten: $anzahl"
          test "$anzahl" -gt 1 || { echo "::error::verdaechtig wenige Seiten ($anzahl)"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
