{{ define "main" }}
{{ $eintraege := where .Site.RegularPages "Section" "posts" }}
<h2 class="vh">Die Einträge</h2>
<ul class="chronik">
{{ range $eintraege }}
  {{ partial "chronik-eintrag.html" . }}
{{ else }}
  <li class="verschollen"><p>Noch kein Eintrag veröffentlicht. Die Tinte ist noch feucht.</p></li>
{{ end }}
</ul>
{{ end }}
